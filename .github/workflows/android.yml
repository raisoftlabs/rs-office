name: RS Office Android release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'ui-preview.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rs-office-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/RSOffice-2.1.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsoffice-apk
          path: out/RSOffice-2.1.apk
          retention-days: 30

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: RS Office v2.1.${{ github.run_number }}
          make_latest: true
          body: |
            **RS Office 2.1** — offline Word, Excel, PowerPoint and PDF studio.

            - Edit .docx, .xlsx and .pptx files directly on the device
            - Preserve untouched document parts so Office opens files cleanly
            - Scan to PDF, convert documents to editable slide decks, run OCR
            - PDF toolkit: merge, split, compress, pages to images, images to PDF
            - No account, no ads, no cloud — documents stay on the phone
          files: out/RSOffice-2.1.apk
