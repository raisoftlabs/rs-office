name: Android release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'ui-preview.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (PPTX writer)
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Vellum-1.2.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vellum-apk
          path: out/Vellum-1.2.apk
          retention-days: 30

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vellum v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Vellum 1.2** — offline office suite.

            - Read Word (.docx), Excel (.xlsx) and PowerPoint (.pptx) on device
            - Export any spreadsheet as a clean PDF table
            - Scan documents to PDF, then typeset them into a real editable deck
            - PDF toolkit: merge, split, compress, pages to PNG, images to PDF, OCR
            - New glossy iOS-style UI with spring animations
            - No account, no ads, nothing leaves the phone
          files: out/Vellum-1.2.apk
